[project]
name = "mcp-least-privilege-auditor"
version = "0.1.0"
description = "Audit MCP servers for excess attack surface by finding exposed but unused tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
]
scripts = {mcp-auditor = "mcp_auditor.cli:app"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]